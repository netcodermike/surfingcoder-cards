<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Play Surf Solitaire solo or Gnarly Eights against the computer at the SurfingCoder card table.">
  <title>SurfingCoder Cards</title>
  <link rel="stylesheet" href="style.css?v=surf-solitaire">
  <script type="module" src="game.js?v=gnarly-eights"></script>
</head>
<body>
  <div class="app-bar"><a href="https://surfingcoder.com/">SurfingCoder</a><a href="https://github.com/netcodermike/surfingcoder-cards">Game source ↗</a></div>
  <main>
    <h1>SurfingCoder <em>Cards</em></h1>
    <div class="modes" aria-label="Choose a card game" role="group">
      <button id="eights" aria-pressed="true">Gnarly Eights</button>
      <button id="golf" aria-pressed="false">Surf Solitaire</button>
      <button id="deal">New deal</button>
    </div>
    <section class="table" aria-label="Card table">
      <div class="table-head">
        <h2 id="mode-title">Gnarly Eights</h2>
        <strong id="score"></strong>
      </div>
      <p id="status" role="status"></p>
      <div id="board"></div>
    </section>
    <details class="rules"><summary>How to play</summary><p id="rules"></p></details>
  </main>
</body>
</html>
